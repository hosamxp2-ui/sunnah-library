<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c5a46"><meta name="description" content="نموذج أولي خفيف لموسوعة السنة النبوية وشروحها"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><title>موسوعة السنة وشروحها</title><style>
:root{--g:#0c5a46;--g2:#16745a;--i:#fbf8ef;--p:#fffdf7;--gold:#c8a65a;--ink:#20332c;--muted:#6e7b73;--line:#e6e0d2}*{box-sizing:border-box}body{margin:0;background:var(--i);color:var(--ink);font-family:system-ui,Tahoma,Arial;line-height:1.75}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:900px;margin:auto;padding:0 16px 32px}header{background:linear-gradient(135deg,#084936,#16745a);color:white;padding:22px 0;border-radius:0 0 24px 24px}.head{max-width:900px;margin:auto;padding:0 18px}.eyebrow{font-size:12px;color:#e7d5a2}.brand{font-size:25px;font-weight:800;margin:4px 0}.subtitle{font-size:13px;margin:0;color:#e2eee7}.searchbox{display:flex;gap:8px;margin-top:16px;background:white;padding:6px;border-radius:14px}.searchbox input{width:100%;min-width:0;border:0;outline:0;padding:9px;color:var(--ink)}.searchbox button,.primary{border:0;background:var(--gold);color:#23392d;font-weight:700;border-radius:10px;padding:8px 14px}.tabs{display:flex;gap:8px;overflow:auto;padding:16px 0 6px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--p);color:var(--ink);padding:8px 13px;border-radius:999px;font-size:13px}.tab.active{background:var(--g);color:white}.hero{margin-top:12px;padding:18px;border:1px solid #e4d9b9;border-radius:18px;background:#fffdf7}.hero h2{margin:0 0 4px;font-size:19px}.hero p,.small{margin:0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat,.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:13px}.stat{text-align:center}.stat strong{display:block;color:var(--g);font-size:18px}.stat span{font-size:11px;color:var(--muted)}.section-title{font-size:18px;margin:20px 0 10px}.card{margin:10px 0}.card h3{margin:0 0 6px;font-size:17px}.meta{font-size:12px;color:var(--muted)}.hadith{font-size:20px;line-height:2;color:#173f30;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill,.status{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;background:#eaf2ec;color:var(--g)}.pill.gold,.status{background:#f8f0d9;color:#735c20}.btn{border:1px solid var(--line);background:white;color:var(--g);border-radius:10px;padding:7px 11px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center}.btn.primary{background:var(--g);color:white}.source{border-top:1px solid var(--line);padding-top:11px;margin-top:11px}.source h4{margin:0;font-size:15px}.source p{margin:3px 0 8px;font-size:13px;color:var(--muted)}.note{background:#f1f5ef;border-right:3px solid var(--g2);padding:10px 12px;border-radius:9px;font-size:13px;margin-top:14px}footer{text-align:center;color:var(--muted);font-size:12px;padding:22px 0}dialog{border:1px solid var(--line);border-radius:18px;max-width:540px;width:calc(100% - 28px);padding:20px;background:var(--p);color:var(--ink)}dialog::backdrop{background:#09281e88}@media(min-width:650px){.brand{font-size:30px}}
</style></head><body><header><div class="head"><div class="eyebrow">مشروع علمي مفتوح — نسخة تجريبية</div><div class="brand">موسوعة السنة وشروحها</div><p class="subtitle">الحديث من مصدره، وشروحه في موضع واحد</p><form class="searchbox" id="searchForm"><input id="searchInput" type="search" placeholder="ابحث بلفظ الحديث أو اسم الكتاب أو الشارح…" aria-label="عبارة البحث"><button type="submit">بحث</button></form></div></header><main class="wrap"><nav class="tabs" aria-label="التنقل الرئيسي"><button class="tab active" data-view="home">الرئيسية</button><button class="tab" data-view="hadith">الأحاديث التجريبية</button><button class="tab" data-view="sources">المصادر والشروح</button><button class="tab" data-view="about">عن المشروع</button></nav><section class="hero"><h2 id="welcomeTitle">من الحديث إلى شروحه</h2><p id="welcomeText">نموذج أولي خفيف يربط الحديث بمصادره مع تمييز ما يحتاج إلى تحقق مباشر.</p></section><div class="stats"><div class="stat"><strong>1</strong><span>حديث تجريبي</span></div><div class="stat"><strong>2</strong><span>مصدران للشرح</span></div><div class="stat"><strong>0</strong><span>مصادر تحقق آليًا</span></div></div><section id="content"></section><footer>نسخة تجريبية · لا يوجد اتصال مباشر بـ Aljam3 في هذه النسخة</footer></main><dialog id="detailsDialog"><div id="dialogBody"></div><div class="row" style="margin-top:16px"><button class="btn primary" id="closeDialog">إغلاق</button></div></dialog><script>
const records=[{id:'bukhari-1',title:'إنما الأعمال بالنيات',text:'إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى…',narrator:'عمر بن الخطاب رضي الله عنه',original:{book:'صحيح البخاري',author:'محمد بن إسماعيل البخاري',place:'كتاب بدء الوحي، باب كيف كان بدء الوحي إلى رسول الله ﷺ',number:'1',url:'https://hadithprophet.com/hadith-30954.html',status:'بيانات منقولة من نتيجة البحث؛ يلزم تدقيق الطبعة عند اعتمادها'},commentaries:[{book:'شرح الأربعين النووية',author:'يحيى بن شرف النووي',page:'16',url:'https://www.aljam3.com/ur/22500/49681/16?i=2',status:'رقم الصفحة منقول من نتيجة بحث ولم تتم معاينته مباشرة'},{book:'فتح الباري شرح صحيح البخاري',author:'أحمد بن علي بن حجر العسقلاني',page:'إحالة 1/13',url:'',status:'الإحالة منقولة؛ لم يتحقق موضع الصفحة ولا يوجد رابط مباشر مثبت لهذا الشرح'}]}];
const content=document.getElementById('content'),dialog=document.getElementById('detailsDialog'),dialogBody=document.getElementById('dialogBody');function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sourceLink(c){return c.url?`<a class="btn" href="${safe(c.url)}" target="_blank" rel="noopener noreferrer">فتح المصدر ↗</a>`:'<span class="status">لا يوجد رابط مباشر متحقق</span>'}function card(r){return `<article class="card"><div class="row"><span class="pill">حديث تجريبي</span><span class="pill gold">يحتاج توثيقًا نهائيًا</span></div><h3>${safe(r.title)}</h3><div class="meta">راويه: ${safe(r.narrator)}</div><p class="hadith">«${safe(r.text)}»</p><div class="source"><h4>${safe(r.original.book)}</h4><p>${safe(r.original.author)} · ${safe(r.original.place)} · رقم الحديث: ${safe(r.original.number)}</p><a class="btn" href="${safe(r.original.url)}" target="_blank" rel="noopener noreferrer">فتح مصدر الحديث ↗</a></div><h3 style="margin-top:18px">الشروح المرتبطة</h3>${r.commentaries.map((c,i)=>`<div class="source"><h4>${safe(c.book)}</h4><p>المؤلف: ${safe(c.author)} · الموضع المسجل: ${safe(c.page)}</p><span class="status">${safe(c.status)}</span><div class="row" style="margin-top:8px">${sourceLink(c)}<button class="btn" data-detail="${i}">تفاصيل التوثيق</button></div></div>`).join('')}<div class="note">هذه بيانات تجريبية منقولة عن نتيجة بحث؛ لم يُختبر اتصال MCP مباشرة ولم تتم معاينة كل الصفحات.</div></article>`}function render(view='home',query=''){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const q=query.trim().toLowerCase(),list=records.filter(r=>!q||[r.title,r.text,r.narrator,r.original.book,r.original.author,...r.commentaries.flatMap(c=>[c.book,c.author,c.page])].join(' ').toLowerCase().includes(q));if(view==='about'){content.innerHTML='<article class="card"><h3>هدف الموسوعة</h3><p>بناء مكتبة حديثية قابلة للتوسع تربط الأحاديث بمصادرها وشروحها، مع بيانات المؤلف والكتاب والموضع والرابط وحالة التحقق.</p><h3>منهج التوثيق</h3><ul><li>لا نعرض رقم صفحة على أنه محقق إلا بعد معاينة مصدر واضح.</li><li>نميز بين بيانات البحث المنقولة والبيانات التي تحققنا منها مباشرة.</li><li>لا ندعي اتصالًا مباشرًا بـ Aljam3 قبل نجاح اختبار تقني مستقل.</li></ul></article>';return}if(view==='sources'){content.innerHTML='<h2 class="section-title">المصادر والشروح</h2>'+list.map(r=>`<article class="card"><h3>${safe(r.original.book)}</h3><p class="small">${safe(r.original.author)} · ${safe(r.original.place)}</p>${r.commentaries.map(c=>`<div class="source"><h4>${safe(c.book)}</h4><p>${safe(c.author)} · ${safe(c.page)}</p><span class="status">${safe(c.status)}</span><div style="margin-top:8px">${sourceLink(c)}</div></div>`).join('')}</article>`).join('')||'<div class="card">لا توجد نتائج مطابقة.</div>';return}content.innerHTML=`<h2 class="section-title">${q?'نتائج البحث':'حديث قيد الاختبار'}</h2>`+(list.map(card).join('')||'<div class="card">لم نعثر على نتائج مطابقة. جرّب لفظًا آخر أو اسم كتاب.</div>')}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.getElementById('searchInput').value='';document.getElementById('welcomeTitle').textContent=({home:'من الحديث إلى شروحه',hadith:'الأحاديث التجريبية',sources:'المصادر والشروح',about:'عن المشروع'})[b.dataset.view];render(b.dataset.view)}));document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();render('hadith',document.getElementById('searchInput').value);document.getElementById('welcomeTitle').textContent='نتائج البحث';document.getElementById('welcomeText').textContent='البحث في البيانات التجريبية الموجودة داخل هذه النسخة فقط.'});content.addEventListener('click',e=>{const b=e.target.closest('[data-detail]');if(!b)return;const c=records[0].commentaries[Number(b.dataset.detail)];dialogBody.innerHTML=`<h3>${safe(c.book)}</h3><p><strong>المؤلف:</strong> ${safe(c.author)}</p><p><strong>الموضع المسجل:</strong> ${safe(c.page)}</p><p><strong>حالة التحقق:</strong> ${safe(c.status)}</p><p>${c.url?`<a href="${safe(c.url)}" target="_blank" rel="noopener noreferrer">فتح رابط المصدر</a>`:'لا يوجد رابط مباشر متحقق لهذا الموضع.'}</p>`;dialog.showModal()});document.getElementById('closeDialog').addEventListener('click',()=>dialog.close());render();if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn))}
</script></body></html>
